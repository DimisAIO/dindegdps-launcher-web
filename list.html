<!DOCTYPE html>
<html lang='en'>
<meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
<head>
  <link href='./css/boxicons.min.css' rel='stylesheet'>
  <link href='./css/quoicoubeh.css' rel='stylesheet'>
  <style>
    #title {
      font-family: Librestile;
    }
    a{color:darkcyan}
    html, body {
      height: 100%;
      margin-left: 2vw;
    }
    body {   
      opacity: 0;
      transition: opacity .5s;   
      background: linear-gradient(90deg, rgba(0,0,0,1) 0%, darkblue 30%, darkblue 70%, rgba(0,0,0,1) 100%);
      color: cornflowerblue;
      font-family: Octarine;
    }
    #gdpsBox {
        border-style: dashed;
        border-radius: 5px;
        border-color: white;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        margin-bottom: 10px;
    }
    #padding {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        text-align: center;
    }
    h2 {
        margin-top: 5%;
    }
    #mbot {
        margin-right: 10px;
    }
    #mbot:hover {
        color: lightcyan;
    }
    #kys {
        display: flex;
        flex-direction: row;
    }
  </style>
  <script src="./js/trans.js"></script>
  <script src="./js/libdinde-locale.js"></script>
</head>
<body>
    <div id="kys">
        <h1 id="title">GDPS List</h1>&nbsp;&nbsp;&nbsp;<h1><a href="https://gallery.dgdps.us.to" id="gallery">(Gallery)</a></h1>
    </div>
    <script src="./js/libdinde.js"></script>
    <script>

        gallery.innerText = phr.galleryText;

        function uninstall(gdps) {
            quoicouSend("delete://" + gdps);
        }

        let gdpsList = [];

        fetch("https://dindegdps.localhost/get/gdps")
        .then(response => response.json())
        .then(data => {
            data.forEach(element => {
                var x = document.createElement("a");
                x.id = "gdpsBox";
                x.href = "javascript:quoicouSend('start://" + element + "')";

                var y = document.createElement("img");
                y.src = "https://dindegdps.localhost/get/img/" + element;
                y.height = 100;
                y.width = 100;
                x.append(y);

                var z = document.createElement("div");
                z.id = "padding";

                var title = document.createElement("h2");
                title.innerText = element;

                var a = document.createElement("a");
                a.innerText = phr.browseText;
                a.href = "javascript:quoicouSend('explorer://" + element + "')";
                a.id = "mbot";

                var b = document.createElement("a");
                b.innerText = phr.uninstallText;
                b.href = "javascript:uninstall('" + element + "')";
                b.id = "mbot";

                x.append(title);
                z.append(a);
                z.append(b);
                x.append(z);

                document.body.append(x);
            });
        })
        .catch(error => alert(error));
    </script>
</body>
</html>
